# ── PROD profile — HTTP on internal port, Nginx handles TLS termination ───────
# Spring Boot listens on HTTP 8080 internally.
# Nginx proxies HTTPS 443 → HTTP 8080 and handles the SSL certificate.

server.port=8080
server.address=127.0.0.1

# SSL disabled — Nginx handles TLS
server.ssl.enabled=false

# Trust the X-Forwarded-* headers from Nginx
server.forward-headers-strategy=NATIVE

# ── Production logging ────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.securechat=INFO
