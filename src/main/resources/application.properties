spring.application.name=SecureMessaging

# ── Active profile ────────────────────────────────────────────────────────────
# Use 'dev' for local HTTPS development, 'prod' for production (Nginx handles TLS)
# Override with: java -jar app.jar --spring.profiles.active=prod
spring.profiles.active=dev

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/secure_chat?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Dialect auto-detected by Hibernate — no need to specify explicitly

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:c2VjdXJlY2hhdC1kZXYtc2VjcmV0LWtleS1kby1ub3QtdXNlLWluLXByb2Q=}
app.jwt.expiration-ms=86400000

# ── Multipart (image uploads) ─────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ── Gmail SMTP ────────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ── OTP Settings ──────────────────────────────────────────────────────────────
app.otp.expiry-minutes=5
app.otp.from-name=SecureChat
